[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printarr"
version = "0.1.0"
description = "Acoustic-fingerprint music identifier, tagger and renamer for Lidarr — like namer, but for music."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "styx-techno" }]
keywords = ["lidarr", "musicbrainz", "acoustid", "chromaprint", "tagging", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mutagen>=1.47",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
printarr = "printarr.cli:main"

[project.urls]
Homepage = "https://github.com/styx-techno/lidarr-printarr"
Issues = "https://github.com/styx-techno/lidarr-printarr/issues"

[tool.setuptools.packages.find]
include = ["printarr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
