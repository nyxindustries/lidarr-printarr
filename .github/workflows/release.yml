# Docker images are published to GitHub Container Registry:
#   ghcr.io/nyxindustries/lidarr-printarr
#
# Three ways this runs:
#   - push to main                -> :edge (rolling development image)
#   - a GitHub release published -> :<version>, :latest
#   - manual "Run workflow" with a version input -> creates the git tag and
#     the GitHub release, then publishes :<version>, :latest
name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version> and a GitHub release)"
        required: true

permissions:
  contents: write   # tag + release creation on the dispatch path
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION:-${{ inputs.version }}}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$VERSION" ]; then
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version matches pyproject.toml
        if: steps.version.outputs.version != ''
        run: |
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PY_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::release version ${{ steps.version.outputs.version }} does not match pyproject.toml version $PY_VERSION — bump pyproject.toml first"
            exit 1
          fi

      - name: Create tag and GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Acoustic-fingerprint music identifier, tagger and renamer for Lidarr
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version || 'edge' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
