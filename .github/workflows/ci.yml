name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # Org self-hosted runner (zelos, Unraid). The runner is itself a container
    # talking to the host Docker via docker.sock, so `container:` jobs break:
    # the runner's externals path does not exist on the host and the job
    # container gets no Node runtime. Instead, tests run via an explicit
    # `docker run` on the workspace — its path is identity-mapped between the
    # runner container and the host, so that mount resolves correctly.
    runs-on: [self-hosted, unraid]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test (python:${{ matrix.python-version }}-slim)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            python:${{ matrix.python-version }}-slim bash -ec '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends ffmpeg libchromaprint-tools > /dev/null
              pip install -q -e ".[dev]"
              ruff check printarr tests
              pytest -v
            '
